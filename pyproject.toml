[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolcity-workforce"
version = "0.1.8"
description = "WorkForce — employment infrastructure for agents: rosters, contracts, schedules, dispatch, budgets, and a tamper-evident shift ledger"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/protocolcity/WorkForce"
Issues = "https://github.com/protocolcity/WorkForce/issues"
Source = "https://github.com/protocolcity/WorkForce"

[project.scripts]
workforce = "workforce.cli:main"
wf = "workforce.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["workforce*"]
