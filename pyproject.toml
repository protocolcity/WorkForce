[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolcity-workforce"
version = "0.1.2"
description = "WorkForce — employment infrastructure for agents: rosters, contracts, schedules, dispatch, budgets, and a tamper-evident shift ledger"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
workforce = "workforce.cli:main"
wf = "workforce.cli:main"

[tool.setuptools]
packages = ["workforce"]
