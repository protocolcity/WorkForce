name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install
        run: |
          pip install pytest
          pip install -e .
      - name: Pytest
        env:
          WORKFORCE_NO_DESK: "1"
        run: pytest tests/ -q
