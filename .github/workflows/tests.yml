name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Public source boundary
        run: python scripts/check_public_surface.py
      - name: Install
        run: |
          pip install pytest
          pip install -e .
      - name: Pytest
        env:
          WORKFORCE_NO_DESK: "1"
          WORKFORCE_DATA_DIR: ${{ runner.temp }}/workforce-fixtures
          WORKLANE_RUNTIME_DIR: ${{ runner.temp }}/worklane-fixtures
          WL_WAKE_DISABLE: "1"
          WL_NTFY_DISABLE: "1"
        run: pytest tests/ -q
